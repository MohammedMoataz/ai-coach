name: CI

on:
  push:
  pull_request:

# Read-only by default. A workflow that can write to the repository is a workflow an injected
# dependency can write to the repository with, and nothing here needs more than checkout.
permissions:
  contents: read

# A second push to the same branch cancels the first: the older run is answering a question about
# code nobody is looking at any more.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # Both supported floors are pinned exactly, because they are what the README promises.
        # node:sqlite needs to be unflagged (22.13+) AND ship FTS5 (22.16+ / 24.0+, verified by
        # probe). The 23.x line has the module without FTS5 and is EOL — deliberately not tested.
        node: ['22.16', '24.0', 'lts/*', 'latest']
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # FTS5 is the one build-level assumption every search here rests on, and it was only ever
      # checked implicitly — by the test suite failing somewhere further in, with an error that
      # named a query rather than the missing feature. Assert it first, and say what is wrong.
      - name: FTS5 is present in this Node's SQLite
        shell: bash
        run: |
          node -e "
            const { DatabaseSync } = require('node:sqlite');
            const db = new DatabaseSync(':memory:');
            try { db.exec(\"CREATE VIRTUAL TABLE t USING fts5(x)\"); }
            catch (err) {
              console.error('This Node build has node:sqlite WITHOUT FTS5 — every search in AI Coach depends on it.');
              console.error(process.version + ': ' + err.message);
              process.exit(1);
            }
            console.log('FTS5 available on ' + process.version);
          "
      - run: node plugins/ai-coach-core/hooks/engine.test.js
      - run: node plugins/ai-coach-core/hooks/hooks.test.js
      - run: node plugins/atlas-coach/tools/ingest.test.js
      - run: node adapters/mcp/server.test.js
      - run: node adapters/shim.test.js
      - run: node adapters/opencode/ai-coach.test.mjs

  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
      # Manifests, frontmatter, versions, and the ENGINE verbs every skill calls — the checker is
      # the lint, and it has its own test so a broken checker cannot pass by finding nothing.
      - run: node .github/check-manifests.test.js
      - run: node .github/check-manifests.js
      # The compiled adapters (Cursor rules, AGENTS.md) are checked in; rebuild and diff so an
      # edited SKILL.md whose compiled twin was forgotten fails here instead of shipping stale.
      - run: node adapters/build.js
      - run: git diff --exit-code adapters/out
